[project]
name = "vlmbench"
version = "0.1.0"
description = "CPU-only efficiency & quantization benchmark for small VLMs"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0",
    "psutil>=5.9",
    "pillow>=10.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
models = [
    "torch>=2.2",
    "transformers>=4.44",
    "accelerate>=0.30",
    "datasets>=2.19",
    "einops>=0.7",
    "timm>=0.9",
]
quant = ["onnxruntime>=1.18", "openvino>=2024.2", "llama-cpp-python>=0.2.80"]
demo = ["gradio>=4.0"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: requires downloading models (deselect with '-m \"not slow\"')"]
addopts = "-m 'not slow'"
