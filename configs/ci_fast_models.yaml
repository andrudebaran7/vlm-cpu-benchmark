# Re-run of the fast models (all but Moondream2) to log per-example scores
# for bootstrap confidence intervals. Same N/seed as the canonical run.
models: [smolvlm-256m, florence2-base, internvl2_5-2b]
backends: [fp32, onnx-int8]
tasks: [docvqa, ocrbench]
warmup: 1
repeats: 3
subsample_n: 120
seed: 20260722
